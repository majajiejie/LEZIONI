const NS='http://www.w3.org/2000/svg';
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
let uid=0;

function griglia(svg,forte){
  el('rect',{x:4,y:4,width:1016,height:1016,rx:40,fill:'#FFFDF7',stroke:'#C8102E','stroke-width':forte?16:22},svg);
  const g={stroke:'#E3CFC0','stroke-width':forte?6:10,'stroke-dasharray':forte?'24 18':'40 30'};
  el('line',{x1:512,y1:10,x2:512,y2:1014,...g},svg);
  el('line',{x1:10,y1:512,x2:1014,y2:512,...g},svg);
  if(forte){el('line',{x1:10,y1:10,x2:1014,y2:1014,...g},svg);el('line',{x1:1014,y1:10,x2:10,y2:1014,...g},svg);}
}
const capovolgi=svg=>el('g',{transform:'translate(0,900) scale(1,-1)'},svg);

/* piccolo riquadro: tratti 1..k, il k-esimo in rosso */
function passo(car,k){
  const d=DATI[car], svg=el('svg',{viewBox:'0 0 1024 1024'}); griglia(svg,false);
  const g=capovolgi(svg);
  d.strokes.forEach((p,i)=>el('path',{d:p,fill:i<k-1?'#2B1B17':(i===k-1?'#C8102E':'#EADFD3')},g));
  return svg;
}

/* carattere grande animabile */
function grande(car){
  const d=DATI[car], svg=el('svg',{viewBox:'0 0 1024 1024',class:'griglia',role:'img','aria-label':car}); griglia(svg,true);
  const defs=el('defs',{},svg), g=capovolgi(svg), id='c'+(uid++);
  const ombre=[],pieni=[],pennelli=[];
  d.strokes.forEach((p,i)=>{
    const cp=el('clipPath',{id:id+'_'+i},defs); el('path',{d:p},cp);
    ombre.push(el('path',{d:p,fill:'#2B1B17'},g));
    const m=d.medians[i]; let pts=m.map(q=>q.join(',')).join(' ');
    // allunga leggermente la mediana per coprire bene le estremità
    const pl=el('polyline',{points:pts,fill:'none',stroke:'#C8102E','stroke-width':150,'stroke-linecap':'round','stroke-linejoin':'round','clip-path':`url(#${id}_${i})`,opacity:0},g);
    pennelli.push(pl);
  });
  svg._anima=async()=>{
    if(svg._corre) return; svg._corre=true;
    ombre.forEach(o=>o.setAttribute('fill','#EADFD3'));
    pennelli.forEach(p=>{p.style.transition='none';p.setAttribute('opacity',0);p.setAttribute('stroke','#C8102E')});
    for(let i=0;i<pennelli.length;i++){
      const p=pennelli[i], L=p.getTotalLength()+150;
      p.style.strokeDasharray=L; p.style.strokeDashoffset=L; p.setAttribute('opacity',1);
      p.getBoundingClientRect();
      const dur=Math.max(350,Math.min(900,L*1.1));
      p.style.transition=`stroke-dashoffset ${dur}ms linear`; p.style.strokeDashoffset=0;
      await new Promise(r=>setTimeout(r,dur+180));
      p.setAttribute('stroke','#2B1B17');
    }
    svg._corre=false;
  };
  svg.addEventListener('click',()=>svg._anima());
  return svg;
}

function parla(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.8;
  const v=speechSynthesis.getVoices().find(v=>/^zh[-_]?(CN|Hans)?/i.test(v.lang)&&!/HK|TW/i.test(v.lang)); if(v)u.voice=v; speechSynthesis.speak(u);}catch(e){}}

const indice=document.getElementById('indice'), lista=document.getElementById('lista');
PAROLE.forEach(w=>{
  const a=document.createElement('a'); a.href='#p'+w.n; a.innerHTML=`<span class="n">${w.n}</span><span class="h">${w.zh}</span>`; indice.appendChild(a);
  const s=document.createElement('section'); s.className='parola'; s.id='p'+w.n;
  s.innerHTML=`<div class="testa"><span class="num">${w.n}</span><div class="grandi"></div>
    <div class="info"><div class="pinyin">${w.py}<span class="cat">${w.cat}</span></div><div class="trad">${w.it}</div>${w.nota?`<div class="nota">${w.nota}</div>`:''}
    <div class="bottoni"><button class="btn oro scrivi">▶ Scrivi</button><button class="btn ascolta">🔊 Ascolta</button></div></div></div>
    <h3>Ordine dei tratti</h3><div class="tratti"></div>
    <div class="esempio"><button class="btn frase">🔊</button><div class="py">${w.es.py}</div><div class="zh">${w.es.zh.replace(w.evid||w.zh,'<mark>'+(w.evid||w.zh)+'</mark>')}</div><div class="it">${w.es.it}</div></div>`;
  const grandi=s.querySelector('.grandi'), tratti=s.querySelector('.tratti'), svgs=[];
  [...w.zh].forEach(c=>{
    const g=grande(c); svgs.push(g); grandi.appendChild(g);
    const r=document.createElement('div'); r.className='riga';
    const n=DATI[c].strokes.length;
    r.innerHTML=`<div class="car">${c}<small>${n} tratti</small></div>`;
    const ps=document.createElement('div'); ps.className='passi';
    for(let k=1;k<=n;k++){const b=document.createElement('div');b.className='passo';b.appendChild(passo(c,k));b.insertAdjacentHTML('beforeend',`<b>${k}</b>`);ps.appendChild(b);}
    r.appendChild(ps); tratti.appendChild(r);
  });
  s._scrivi=async()=>{for(const g of svgs) await g._anima();};
  s.querySelector('.scrivi').onclick=()=>s._scrivi();
  s.querySelector('.ascolta').onclick=()=>parla(w.zh);
  s.querySelector('.frase').onclick=()=>parla(w.es.zh);
  lista.appendChild(s);
});
document.getElementById('tutto').onclick=async()=>{
  for(const s of lista.children){s.scrollIntoView({behavior:'smooth',block:'start'}); await s._scrivi(); await new Promise(r=>setTimeout(r,500));}
};
