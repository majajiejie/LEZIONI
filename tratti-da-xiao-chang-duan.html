<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tratti di 大小长短</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500&text=%E5%A4%A7%E5%AD%97%E5%B0%8F%E6%8A%98%E6%8D%BA%E6%8F%90%E6%92%87%E6%A0%BC%E6%A8%AA%E7%82%B9%E7%94%B0%E7%9F%AD%E7%AB%96%E9%92%A9%E9%95%BF&display=swap">
<style>
/* Layout: lavagna 16:9 scalata come le altre lezioni Maja Jiejie; a sinistra il 田字格 dove il pennello scrive un tratto alla volta, a destra parola, tratto e comandi */
[hidden]{display:none!important}
:root{
  --crema:#FBF3E4; --carta:#FFFDF7; --rosso:#C8102E; --rosso-chiaro:#F6D5CF;
  --oro:#E9B949; --oro-chiaro:#FBEBC0; --verde:#3F8A2A; --verde-chiaro:#CDE8BC; --azzurro:#2F7FB8; --azzurro-chiaro:#D6E8F5;
  --viola:#7A4FB0; --ink:#2B1B17; --grigio:#6A5A55; --fondo:#E8D9C4; --guida:#E3CFC0; --ombra:#EADFD3;
  --f-body:'Fredoka','Trebuchet MS',Arial,sans-serif;
  --f-han:'Noto Sans SC','PingFang SC','Microsoft YaHei','Heiti SC',sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--fondo);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
:focus-visible{outline:4px solid var(--azzurro);outline-offset:3px}

.viewport{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:calc(64px + env(safe-area-inset-bottom,0px))}
.stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;transform:translate(-50%,-50%) scale(.5);background:var(--crema);border-radius:18px;overflow:hidden;box-shadow:0 10px 40px rgba(90,40,20,.25)}
.cornice{position:absolute;inset:18px;border:4px solid var(--rosso);border-radius:10px;pointer-events:none;box-shadow:inset 0 0 0 8px var(--crema),inset 0 0 0 11px var(--oro)}
.lanterna{position:absolute;top:0;width:110px;height:184px;pointer-events:none}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block;animation:entra .45s ease both}
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.nav{position:fixed;left:0;right:0;bottom:0;height:64px;padding:0 16px env(safe-area-inset-bottom,0px);display:flex;align-items:center;justify-content:center;gap:14px;background:var(--fondo)}
.nav button{border:3px solid var(--ink);background:var(--carta);border-radius:999px;height:44px;min-width:44px;padding:0 16px;font-weight:600;font-size:17px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.nav button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.nav .conta{font-weight:600;font-size:17px;min-width:90px;text-align:center;font-variant-numeric:tabular-nums}
.nav .titolo-slide{font-size:15px;color:var(--grigio);max-width:30vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){.nav .titolo-slide{display:none}}

.abs{position:absolute}
.han{font-family:var(--f-han);line-height:1.05;font-weight:500}
.btn{border:4px solid var(--ink);background:var(--carta);border-radius:999px;padding:12px 28px;font-size:30px;font-weight:600;cursor:pointer;box-shadow:0 6px 0 var(--ink);transition:transform .08s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn.oro{background:var(--oro)}
.btn.attivo{background:var(--verde-chiaro)}
.cornice-han{background:var(--carta);border:5px solid var(--rosso);border-radius:14px;box-shadow:inset 0 0 0 7px var(--carta),inset 0 0 0 10px var(--oro)}
.carta-c{border:4px solid var(--ink);border-radius:22px;background:var(--carta);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 6px 0 var(--ink);transition:transform .15s;padding:14px}
.carta-c:hover{transform:translateY(-4px)}

/* 田字格 */
.griglia{display:block;background:var(--carta);border-radius:10px}
.griglia .tratto{fill:none;stroke-linecap:round;stroke-linejoin:round}
.griglia .num{font-family:var(--f-body);font-weight:700;font-size:6px}
.traccia{touch-action:none;cursor:crosshair}

/* tratti mostrati a destra */
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:56px;height:56px;border-radius:14px;border:3px solid var(--ink);background:var(--carta);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.chip.fatto{background:var(--oro)}
.chip.ora{background:var(--rosso);color:var(--carta);transform:scale(1.1)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="lanterna" viewBox="0 0 90 150"><line x1="45" y1="0" x2="45" y2="30" stroke="#8A1C1C" stroke-width="4"/><rect x="25" y="26" width="40" height="10" rx="3" fill="#E9B949"/><ellipse cx="45" cy="75" rx="40" ry="40" fill="#D7262E"/><path d="M45 35 V115 M25 42 Q15 75 25 108 M65 42 Q75 75 65 108" stroke="#A3121F" stroke-width="3" fill="none"/><rect x="25" y="112" width="40" height="10" rx="3" fill="#E9B949"/><path d="M38 122 V148 M45 122 V150 M52 122 V148" stroke="#D7262E" stroke-width="4"/></symbol>
</defs></svg>

<div class="viewport" id="viewport">
<div class="stage" id="stage" role="region" aria-label="Animazioni dell'ordine dei tratti di 大 小 长 短">

<!-- 1 INTRO -->
<section class="slide" data-titolo="Come si scrivono?">
  <div class="cornice"></div>
  <svg class="lanterna" style="left:60px"><use href="#lanterna"/></svg><svg class="lanterna" style="left:1450px"><use href="#lanterna"/></svg>
  <h1 class="abs" style="left:0;right:0;top:80px;margin:0;text-align:center;font-size:96px;color:var(--rosso)">Come si scrivono?</h1>
  <p class="abs" style="left:0;right:0;top:205px;margin:0;text-align:center;font-size:38px;font-weight:600">Guardate il pennello: un tratto alla volta, sempre nello stesso ordine!</p>
  <div class="abs" id="intro-carte" style="left:150px;top:300px;width:1300px;display:grid;grid-template-columns:repeat(4,1fr);gap:26px"></div>
</section>

<!-- 2-5 CARATTERI (riempite dallo script) -->
<section class="slide car" data-car="0" data-titolo="大 dà"></section>
<section class="slide car" data-car="1" data-titolo="小 xiǎo"></section>
<section class="slide car" data-car="2" data-titolo="长 cháng"></section>
<section class="slide car" data-car="3" data-titolo="短 duǎn"></section>

</div>
</div>

<nav class="nav" aria-label="Navigazione">
  <button id="prec" aria-label="Slide precedente">◀</button>
  <span class="conta" id="conta">1 / 5</span>
  <button id="succ" aria-label="Slide successiva">▶</button>
  <span class="titolo-slide" id="titolo-slide"></span>
  <button id="schermo" aria-label="Schermo intero">⛶</button>
</nav>

<script>
(function(){
const stage=document.getElementById('stage');
const slides=[...stage.querySelectorAll('.slide')];
let cur=0;
const riduci=matchMedia('(prefers-reduced-motion: reduce)').matches;

// nomi dei tratti
const T={
  heng:{han:'横',py:'héng',it:'orizzontale →'},
  shu:{han:'竖',py:'shù',it:'verticale ↓'},
  pie:{han:'撇',py:'piě',it:'scende a sinistra ↙'},
  na:{han:'捺',py:'nà',it:'scende a destra ↘'},
  dian:{han:'点',py:'diǎn',it:'punto'},
  shugou:{han:'竖钩',py:'shùgōu',it:'verticale con gancio'},
  shuti:{han:'竖提',py:'shùtí',it:'verticale che risale'},
  hengzhe:{han:'横折',py:'héngzhé',it:'orizzontale che piega giù'}
};
// tratti disegnati nel quadrato 0-100, nell'ordine giusto
const CAR=[
  {han:'大',py:'dà',it:'grande',col:'#C8102E',w:9,tratti:[
    ['heng','M16 40 L84 39'],
    ['pie','M50 12 L50 40 Q46 68 16 88'],
    ['na','M53 44 Q64 70 86 86']]},
  {han:'小',py:'xiǎo',it:'piccolo',col:'#2F7FB8',w:9,tratti:[
    ['shugou','M50 10 L50 82 Q50 90 39 84'],
    ['dian','M31 38 Q26 54 17 66'],
    ['dian','M68 37 Q76 50 83 63']]},
  {han:'长',py:'cháng',it:'lungo',col:'#3F8A2A',w:9,tratti:[
    ['pie','M68 12 Q58 26 44 34'],
    ['shuti','M34 10 L34 78 L54 68'],
    ['heng','M12 48 L88 47'],
    ['na','M48 52 Q62 74 88 88']]},
  {han:'短',py:'duǎn',it:'corto',col:'#7A4FB0',w:6.5,tratti:[
    ['pie','M20 10 Q17 20 10 30'],
    ['heng','M16 26 L38 25'],
    ['heng','M8 46 L42 45'],
    ['pie','M25 20 L25 48 Q22 70 8 84'],
    ['dian','M29 58 L38 68'],
    ['heng','M50 14 L92 13'],
    ['shu','M55 26 L55 50'],
    ['hengzhe','M55 26 L87 26 L86 50'],
    ['heng','M55 49 L86 49'],
    ['dian','M60 60 L66 72'],
    ['pie','M83 58 L76 74'],
    ['heng','M48 85 L94 83']]}
];

function fit(){ const vp=document.getElementById('viewport').getBoundingClientRect();
  stage.style.transform=`translate(-50%,-50%) scale(${Math.min(vp.width/1600,vp.height/900)*0.97})`; }
addEventListener('resize',fit); fit();

const uscita={}; let pronto=false;
function vai(i){
  i=Math.max(0,Math.min(slides.length-1,i));
  if(pronto&&i===cur) return;
  if(uscita[cur]) uscita[cur]();
  slides[cur].classList.remove('on'); cur=i; const s=slides[cur]; s.classList.add('on');
  document.getElementById('conta').textContent=`${cur+1} / ${slides.length}`;
  document.getElementById('titolo-slide').textContent=s.dataset.titolo||'';
  try{history.replaceState(null,'','#s'+(cur+1))}catch(e){}
  if(pronto&&cur===0) loopIntro();
}
document.getElementById('prec').onclick=()=>vai(cur-1);
document.getElementById('succ').onclick=()=>vai(cur+1);
document.getElementById('schermo').onclick=()=>{try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){}};
addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key==='PageDown') vai(cur+1); if(e.key==='ArrowLeft'||e.key==='PageUp') vai(cur-1); });
let sx=null;
stage.addEventListener('touchstart',e=>{ if(e.target.closest('button,.traccia')){sx=null;return} sx=e.touches[0].clientX },{passive:true});
stage.addEventListener('touchend',e=>{ if(sx===null) return; const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>60) vai(cur+(dx<0?1:-1)); sx=null });

function dici(t){ try{ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t); u.lang='zh-CN'; u.rate=.72;
  const v=speechSynthesis.getVoices().find(v=>/^zh/i.test(v.lang)); if(v) u.voice=v; speechSynthesis.speak(u); }catch(e){} }

const NS='http://www.w3.org/2000/svg';
const GUIDA=`<rect x="1" y="1" width="98" height="98" rx="2" fill="none" stroke="#C8102E" stroke-width="1.2"/>
  <path d="M50 1 V99 M1 50 H99" stroke="#E3CFC0" stroke-width=".7" stroke-dasharray="2.4 2.4"/>
  <path d="M1 1 L99 99 M99 1 L1 99" stroke="#EADFD3" stroke-width=".6" stroke-dasharray="2.4 2.4"/>`;
// griglia: ombra del carattere + tratti che si disegnano
function griglia(c,{numeri=true}={}){
  const svg=document.createElementNS(NS,'svg'); svg.setAttribute('viewBox','0 0 100 100'); svg.setAttribute('class','griglia');
  svg.innerHTML=GUIDA+c.tratti.map(([,d])=>`<path class="tratto" d="${d}" stroke="#EADFD3" stroke-width="${c.w}"/>`).join('')
    +`<g class="pennello"></g><g class="numeri"></g><g class="miei"></g>`;
  const g=svg.querySelector('.pennello');
  const paths=c.tratti.map(([,d])=>{const p=document.createElementNS(NS,'path'); p.setAttribute('class','tratto'); p.setAttribute('d',d);
    p.setAttribute('stroke',c.col); p.setAttribute('stroke-width',c.w); g.appendChild(p); return p});
  return {svg,paths,numeri};
}

// ---- 1 intro: ogni carta si scrive da sola in loop
const giri=[];
(function(){
  const box=document.getElementById('intro-carte');
  CAR.forEach((c,k)=>{
    const b=document.createElement('button'); b.className='carta-c'; b.setAttribute('aria-label',`Vai a ${c.han}, ${c.it}`);
    const area=document.createElement('div'); area.style.cssText='width:250px;height:250px';
    const gr=griglia(c); area.appendChild(gr.svg); b.appendChild(area);
    b.insertAdjacentHTML('beforeend',`<span style="font-size:40px;font-weight:600;color:${c.col}">${c.py}</span><span style="font-size:30px">${c.it}</span><span style="font-size:24px;font-weight:600;color:var(--grigio)">${c.tratti.length} tratti</span>`);
    b.onclick=()=>vai(1+k); box.appendChild(b);
    giri.push(gr);
  });
})();

// ---- animazione di un singolo tratto
function lung(p){ try{return p.getTotalLength()}catch(e){return 100} }
function nascondi(p){ const L=lung(p); p.style.strokeDasharray=L+' '+L; p.style.strokeDashoffset=L; p.style.transition='none'; }
function mostra(p){ p.style.strokeDasharray='none'; p.style.strokeDashoffset=0; }
function anima(p,velocita=1){
  return new Promise(ok=>{
    const L=lung(p); if(riduci){mostra(p); return setTimeout(ok,150)}
    p.style.strokeDasharray=L+' '+L; p.style.strokeDashoffset=L;
    const dur=Math.max(450,L*16)/velocita;
    const a=p.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:dur,easing:'ease-in-out',fill:'forwards'});
    a.onfinish=()=>{mostra(p); a.cancel(); ok()}; p._anim=a;
  });
}
const attesa=ms=>new Promise(r=>setTimeout(r,ms));

// loop delle carte dell'intro
let introVivo=0;
async function loopIntro(){
  const io=++introVivo;
  while(io===introVivo){
    giri.forEach(g=>g.paths.forEach(nascondi));
    await Promise.all(giri.map(async g=>{ for(const p of g.paths){ if(io!==introVivo) return; await anima(p,1.6); await attesa(120) } }));
    await attesa(1600);
  }
}

// ---- 2-5 slide dei caratteri
stage.querySelectorAll('.slide.car').forEach(s=>{
  const n=+s.dataset.car, c=CAR[n];
  s.innerHTML=`<div class="cornice"></div>
    <svg class="lanterna" style="left:1450px"><use href="#lanterna"/></svg>
    <div class="abs cornice-han" style="left:70px;top:70px;width:760px;height:760px;box-sizing:border-box;padding:28px"><div class="area" style="width:100%;height:100%;position:relative"></div></div>
    <div class="abs" style="left:880px;top:70px;width:560px;display:flex;flex-direction:column;gap:20px">
      <div style="display:flex;align-items:center;gap:26px">
        <span class="han" style="font-size:150px;color:${c.col}">${c.han}</span>
        <span style="display:flex;flex-direction:column;gap:6px"><span style="font-size:60px;font-weight:600">${c.py}</span><span style="font-size:36px">${c.it}</span>
        <button class="btn" data-dici="${c.han}" style="font-size:24px;padding:6px 18px;align-self:flex-start">🔊 Ascolta</button></span>
      </div>
      <div class="info cornice-han" style="padding:22px 28px;min-height:150px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:8px">
        <span class="info-n" style="font-size:28px;font-weight:600;color:var(--grigio)">Premete ▶ e guardate il pennello!</span>
        <span class="info-t" style="font-size:44px;font-weight:700"></span>
      </div>
      <div class="chips" style="display:flex;flex-wrap:wrap;gap:10px"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px">
        <button class="btn oro b-tutto">▶ Guarda tutto</button>
        <button class="btn oro b-uno">👆 Un tratto</button>
        <button class="btn b-ricomincia">↺ Ricomincia</button>
        <button class="btn b-prova">✏️ Prova tu</button>
      </div>
      <button class="btn b-cancella" hidden style="align-self:center">🧽 Cancella il mio disegno</button>
    </div>`;
  const area=s.querySelector('.area'), gr=griglia(c); area.appendChild(gr.svg);
  gr.svg.style.width='100%'; gr.svg.style.height='100%';
  const chips=s.querySelector('.chips'), infoN=s.querySelector('.info-n'), infoT=s.querySelector('.info-t');
  const numG=gr.svg.querySelector('.numeri'), mieiG=gr.svg.querySelector('.miei');
  c.tratti.forEach((t,k)=>{const x=document.createElement('span');x.className='chip';x.textContent=k+1;x.title=T[t[0]].it;chips.appendChild(x)});
  let fatti=0, corsa=0, occupato=false;

  function numero(k){
    const p=gr.paths[k], a=p.getPointAtLength(0), b=p.getPointAtLength(2);
    let dx=a.x-b.x, dy=a.y-b.y; const l=Math.hypot(dx,dy)||1; dx/=l; dy/=l;
    const x=Math.min(95,Math.max(5,a.x+dx*7)), y=Math.min(95,Math.max(5,a.y+dy*7));
    const g=document.createElementNS(NS,'g');
    g.innerHTML=`<circle cx="${x}" cy="${y}" r="4.2" fill="#E9B949" stroke="#2B1B17" stroke-width=".8"/><text class="num" x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" fill="#2B1B17">${k+1}</text>`;
    numG.appendChild(g);
  }
  function stato(k){
    [...chips.children].forEach((x,i)=>{x.classList.toggle('fatto',i<fatti); x.classList.toggle('ora',i===k)});
    if(k==null){ infoN.textContent=fatti===c.tratti.length?`Finito! ${c.tratti.length} tratti`:'Premete ▶ e guardate il pennello!'; infoT.innerHTML=fatti===c.tratti.length?`<span class="han" style="color:${c.col}">${c.han}</span> ${c.py} ✅`:''; return }
    const t=T[c.tratti[k][0]];
    infoN.textContent=`Tratto ${k+1} di ${c.tratti.length}`;
    infoT.innerHTML=`<span class="han" style="color:${c.col}">${t.han}</span> ${t.py} · <span style="font-weight:500;font-size:34px">${t.it}</span>`;
  }
  function azzera(){ corsa++; occupato=false; fatti=0; gr.paths.forEach(p=>{ if(p._anim) p._anim.cancel(); nascondi(p) }); numG.innerHTML=''; stato(null) }
  async function uno(){
    if(occupato||fatti>=c.tratti.length) return false;
    occupato=true; const k=fatti, io=corsa; stato(k); numero(k);
    await anima(gr.paths[k]); if(io!==corsa) return false;
    fatti++; occupato=false;
    if(fatti===c.tratti.length){ stato(null); dici(c.han) } return true;
  }
  s.querySelector('.b-tutto').onclick=async()=>{ azzera(); const io=corsa; await attesa(250);
    while(io===corsa&&fatti<c.tratti.length){ await uno(); await attesa(350) } };
  s.querySelector('.b-uno').onclick=()=>{ if(fatti>=c.tratti.length) azzera(); uno() };
  s.querySelector('.b-ricomincia').onclick=azzera;
  s.querySelector('[data-dici]').onclick=()=>dici(c.han);

  // prova tu: il bambino ripassa con il dito sull'ombra
  const bProva=s.querySelector('.b-prova'), bCanc=s.querySelector('.b-cancella');
  let prova=false, linea=null;
  bProva.onclick=()=>{ prova=!prova; bProva.classList.toggle('attivo',prova); bCanc.hidden=!prova; gr.svg.classList.toggle('traccia',prova);
    if(prova){ azzera(); infoN.textContent='Tocca a voi!'; infoT.innerHTML='Ripassate l\'ombra con il dito, nell\'ordine dei numeri.'; c.tratti.forEach((_,k)=>numero(k)) }
    else { mieiG.innerHTML=''; azzera() } };
  bCanc.onclick=()=>{ mieiG.innerHTML='' };
  function punto(e){ const p=gr.svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; const m=gr.svg.getScreenCTM(); return m?p.matrixTransform(m.inverse()):p }
  gr.svg.addEventListener('pointerdown',e=>{ if(!prova) return; e.preventDefault(); try{gr.svg.setPointerCapture(e.pointerId)}catch(_){}
    const q=punto(e); linea=document.createElementNS(NS,'path'); linea.setAttribute('class','tratto'); linea.setAttribute('stroke','#2B1B17'); linea.setAttribute('stroke-width',c.w*.55);
    linea._d=`M${q.x.toFixed(1)} ${q.y.toFixed(1)}`; linea.setAttribute('d',linea._d+' l0 0'); mieiG.appendChild(linea) });
  gr.svg.addEventListener('pointermove',e=>{ if(!prova||!linea) return; const q=punto(e); linea._d+=` L${q.x.toFixed(1)} ${q.y.toFixed(1)}`; linea.setAttribute('d',linea._d) });
  const fine=()=>{ linea=null }; gr.svg.addEventListener('pointerup',fine); gr.svg.addEventListener('pointercancel',fine);

  uscita[n+1]=()=>{ if(prova) bProva.onclick(); azzera() };
  azzera();
});

uscita[0]=()=>{ introVivo++ };
