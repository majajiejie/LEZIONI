<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YCT 1 · Lezione 7 · Ordine dei tratti</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Noto+Sans+SC:wght@400;700&family=Noto+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8ef;--ink:#3a2e2a;--soft:#7a6a62;--teal:#16a394;--teal2:#5fd1b9;--red:#e0524a;--yellow:#ffd65c;--line:#f0e2d2;--grid:#bfe9e1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Baloo 2',system-ui,sans-serif;font-size:22px}
.zh{font-family:'Noto Sans SC',sans-serif}
.py{font-family:'Noto Sans','Segoe UI',Arial,sans-serif;color:var(--red);font-weight:500}
header{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;padding:20px 16px 16px;text-align:center}
header h1{margin:0;font-size:42px;font-family:'Noto Sans',Arial,sans-serif}
header p{margin:4px 0 0;font-size:22px}
.words{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:12px 16px;background:#fff;border-bottom:2px solid var(--line);position:sticky;top:0;z-index:5}
.words button{border:0;border-radius:16px;padding:4px 14px;font:inherit;font-size:28px;background:var(--line);cursor:pointer;font-family:'Noto Sans SC',sans-serif}
.words button.on{background:var(--teal);color:#fff}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.wordhead{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;margin-bottom:14px}
.wordhead .pic{font-size:64px}
.wordhead .zh{font-size:64px}
.wordhead .py{font-size:30px;display:block}
.wordhead .it{color:var(--soft);font-size:26px}
.spk{border:0;background:var(--yellow);border-radius:50%;width:54px;height:54px;font-size:26px;cursor:pointer}
.char{background:#fff;border:3px solid var(--line);border-radius:26px;padding:18px;margin-bottom:20px}
.top{display:flex;gap:22px;align-items:center;flex-wrap:wrap;justify-content:center}
.tzg{width:280px;height:280px;border:3px solid var(--teal);border-radius:12px;background:
 linear-gradient(var(--grid),var(--grid)) center/100% 2px no-repeat,linear-gradient(var(--grid),var(--grid)) center/2px 100% no-repeat}
.ctrl{display:flex;flex-direction:column;gap:10px;min-width:250px}
.btn{border:0;border-radius:16px;padding:10px 18px;font:inherit;font-size:22px;cursor:pointer;background:var(--teal);color:#fff}
.btn.alt{background:#9a7bd1}.btn.ghost{background:var(--line);color:var(--ink)}
.count{font-size:26px;text-align:center}
.count b{color:var(--red);font-size:34px}
.steps{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;justify-content:center}
.step{position:relative}
.step svg{width:78px;height:78px;border:2px solid var(--teal);border-radius:8px;background:#fff}
.step span{position:absolute;top:2px;left:5px;font-size:14px;color:var(--soft);font-weight:700}
.navw{display:flex;justify-content:center;gap:20px;margin-top:10px}
.navw .btn{font-size:26px;padding:10px 28px}
.hw{background:#e6f7f4;border:3px dashed var(--teal);border-radius:22px;padding:14px 18px;margin-top:20px;font-size:24px;text-align:center}
.wait{color:var(--soft);text-align:center}
footer{text-align:center;color:var(--soft);font-size:18px;padding:12px}
@media print{.words,.ctrl,.navw,header .no{display:none}.char{break-inside:avoid}}
</style>
</head>
<body>
<header>
  <h1>✍️ Ordine dei tratti · YCT 1 · Lezione 7</h1>
  <p><span class="zh">这是谁的狗？</span> · Guarda il pennello, conta i tratti e poi scrivi sul quaderno!</p>
</header>
<div class="words" id="words"></div>
<main>
  <div class="wordhead" id="wh"></div>
  <div id="chars"></div>
  <div class="navw"><button class="btn ghost" onclick="go(-1)">◀ Indietro</button><button class="btn" onclick="go(1)">Avanti ▶</button></div>
  <div class="hw">📝 <b>Compito</b>: scrivi ogni carattere <b>5 volte</b> sul quaderno, seguendo l'ordine dei tratti.<br>Poi manda la foto alla maestra! 📸</div>
</main>
<footer>Maja Jiejie · Chinese Academy</footer>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
<script>
const W=[["猫", "māo", "gatto", "🐱"], ["狗", "gǒu", "cane", "🐶"], ["鱼", "yú", "pesce", "🐟"], ["鸟", "niǎo", "uccello", "🐦"], ["这", "zhè", "questo", "👇"], ["那", "nà", "quello", "👉"], ["看", "kàn", "guardare", "👀"], ["这儿", "zhèr", "qui", "📍"], ["多", "duō", "tanti, molto", "🐟🐟🐟"], ["那儿", "nàr", "là", "🏞️"]];
let cur=0, writers=[];
let zhVoice=null;
function loadVoice(){const v=speechSynthesis.getVoices();zhVoice=v.find(x=>/zh[-_]CN/i.test(x.lang))||v.find(x=>/^zh/i.test(x.lang))||null}
if('speechSynthesis' in window){loadVoice();speechSynthesis.onvoiceschanged=loadVoice}
function say(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';if(zhVoice)u.voice=zhVoice;u.rate=.75;speechSynthesis.speak(u)}
const chars=w=>w.replace(/[^一-鿿]/g,'').split('');

document.getElementById('words').innerHTML=W.map((w,i)=>`<button onclick="show(${i})">${w[0]}</button>`).join('');

function stepSvg(strokes,k){
 let p='';for(let i=0;i<=k;i++)p+=`<path d="${strokes[i]}" fill="${i===k?'#e0524a':'#3a2e2a'}"/>`;
 return `<div class="step"><span>${k+1}</span><svg viewBox="0 0 1024 1024"><line x1="0" y1="512" x2="1024" y2="512" stroke="#bfe9e1" stroke-width="10"/><line x1="512" y1="0" x2="512" y2="1024" stroke="#bfe9e1" stroke-width="10"/><g transform="translate(0,900) scale(1,-1)">${p}</g></svg></div>`;
}

function show(i){
 cur=i;const w=W[i];
 document.querySelectorAll('#words button').forEach((b,k)=>b.classList.toggle('on',k===i));
 document.getElementById('wh').innerHTML=`<span class="pic">${w[3]}</span><div><span class="py">${w[1]}</span><span class="zh">${w[0]}</span></div><span class="it">${w[2]}</span><button class="spk" onclick="say('${w[0]}')">🔊</button>`;
 const cs=chars(w[0]);writers=[];
 document.getElementById('chars').innerHTML=cs.map((c,k)=>`<div class="char"><div class="top">
   <div class="tzg" id="tz${k}"></div>
   <div class="ctrl">
     <div class="count"><span class="zh" style="font-size:40px">${c}</span> · tratti: <b id="n${k}">…</b></div>
     <button class="btn" onclick="anim(${k})">▶ Guarda tutto</button>
     <button class="btn ghost" onclick="stepB(${k})">👆 Un tratto alla volta <span id="sb${k}"></span></button>
     <button class="btn alt" onclick="quiz(${k})">✍️ Prova tu</button>
   </div></div>
   <div class="steps" id="st${k}"><div class="wait">Carico i tratti…</div></div></div>`).join('');
 if(typeof HanziWriter==='undefined'){document.getElementById('chars').innerHTML='<p class="wait">Serve la connessione a internet per vedere i tratti.</p>';return}
 cs.forEach((c,k)=>{
  const wr=HanziWriter.create('tz'+k,c,{width:280,height:280,padding:16,showOutline:true,strokeColor:'#3a2e2a',radicalColor:'#3a2e2a',outlineColor:'#e6dcd5',highlightColor:'#16a394',drawingColor:'#16a394',strokeAnimationSpeed:.6,delayBetweenStrokes:450});
  wr._step=0;writers[k]=wr;
  HanziWriter.loadCharacterData(c).then(d=>{
   document.getElementById('n'+k).textContent=d.strokes.length;wr._n=d.strokes.length;
   document.getElementById('st'+k).innerHTML=d.strokes.map((_,j)=>stepSvg(d.strokes,j)).join('');
  }).catch(()=>{document.getElementById('st'+k).innerHTML='<p class="wait">Non riesco a caricare questo carattere.</p>'});
 });
 window.scrollTo(0,0);
}
function anim(k){const w=writers[k];w._step=0;document.getElementById('sb'+k).textContent='';w.animateCharacter()}
function stepB(k){const w=writers[k];if(!w._n)return;
 if(w._step===0||w._step>=w._n){w.hideCharacter();w._step=0}
 w.animateStroke(w._step);w._step++;document.getElementById('sb'+k).textContent=`(${w._step}/${w._n})`}
function quiz(k){const w=writers[k];w._step=0;document.getElementById('sb'+k).textContent='';w.quiz({onComplete:()=>{document.getElementById('sb'+k).textContent='🌟 Bravo!'}})}
function go(d){show(Math.max(0,Math.min(W.length-1,cur+d)))}
show(0);
</script>
</body>
</html>
