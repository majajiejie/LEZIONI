<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YCT 1 · Lezione 3 · Word Wall</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Sans:wght@600;700&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7e6;--card:#ffffff;--ink:#3b2a1a;--red:#e63946;--yellow:#ffd166;--green:#06d6a0;--blue:#118ab2;--purple:#8e5cd9;--shadow:0 6px 0 rgba(0,0,0,.12)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Baloo 2',system-ui,sans-serif;min-height:100vh}
header{text-align:center;padding:20px 16px 6px}
header h1{margin:0;font-size:clamp(28px,5vw,46px);color:var(--red)}
header p{margin:2px 0 0;font-size:clamp(18px,2.6vw,24px)}
.zh{font-family:'Noto Sans SC',sans-serif}
.py,.it,#fdClue{font-family:'Noto Sans',Arial,sans-serif;font-weight:600}
nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:14px 16px}
nav button{font:inherit;font-size:20px;border:0;border-radius:18px;padding:10px 20px;cursor:pointer;color:#fff;box-shadow:var(--shadow)}
nav button.on{outline:4px solid var(--ink)}
.b1{background:var(--red)}.b2{background:var(--blue)}.b3{background:var(--green)}.b4{background:var(--purple)}
section{display:none;max-width:1100px;margin:0 auto;padding:10px 16px 40px}
section.on{display:block}
.hint{text-align:center;font-size:22px;margin:4px 0 16px}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.tile{position:relative;height:200px;perspective:800px;cursor:pointer}
.tile .in{position:absolute;inset:0;transition:transform .5s;transform-style:preserve-3d}
.tile.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;box-shadow:var(--shadow);background:var(--card);border:5px solid var(--yellow)}
.face .big{font-size:76px;line-height:1}
.back{transform:rotateY(180deg);background:var(--yellow);border-color:var(--red)}
.back .py{font-size:34px;color:var(--red)}
.back .it{font-size:26px}
.back .em{font-size:36px}
.tile.small .big{font-size:52px}
/* ruota */
.stage{display:flex;flex-direction:column;align-items:center;gap:18px}
.show{width:min(520px,100%);min-height:300px;border-radius:30px;background:var(--card);border:6px solid var(--blue);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.show .big{font-size:130px;line-height:1.1}
.show .py{font-size:40px;color:var(--red);min-height:52px}
.show .it{font-size:30px;min-height:40px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{font:inherit;font-size:22px;border:0;border-radius:18px;padding:12px 24px;cursor:pointer;background:var(--ink);color:#fff;box-shadow:var(--shadow)}
.btn.y{background:var(--yellow);color:var(--ink)}
.btn.g{background:var(--green)}
/* trova */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;width:min(800px,100%)}
.opt{font-size:64px;height:130px;border-radius:22px;border:5px solid var(--yellow);background:var(--card);cursor:pointer;box-shadow:var(--shadow);font-family:'Noto Sans SC',sans-serif;color:var(--ink)}
.opt.ok{background:var(--green);border-color:var(--green);color:#fff}
.opt.no{background:#ffd6d9;border-color:var(--red)}
.score{font-size:26px}
/* grida */
#shoutWord{transition:font-size .3s, color .3s}
.mode{font-size:40px;font-weight:800;min-height:56px}
.loud{color:var(--red)}
.soft{color:var(--blue)}
.stars{font-size:34px;min-height:44px}
</style>
</head>
<body>
<header>
  <h1>🐼 Ripassiamo! <span class="zh">复习</span></h1>
  <p>YCT 1 · Lezione 3 · <span class="zh">他是谁？</span></p>
</header>

<nav>
  <button class="b1 on" data-s="wall">🧱 Il muro</button>
  <button class="b2" data-s="spin">🎲 Parola a sorpresa</button>
  <button class="b3" data-s="find">🔍 Trova la parola</button>
  <button class="b4" data-s="shout">📢 Grida e sussurra</button>
</nav>

<section id="wall" class="on">
  <p class="hint">Tocca un mattone per girarlo e sentire la parola 🔊</p>
  <div class="wall" id="wallGrid"></div>
</section>

<section id="spin">
  <div class="stage">
    <p class="hint">Esce una parola: chi la legge per primo?</p>
    <div class="show"><div class="big zh" id="spWord">?</div><div class="py" id="spPy"></div><div class="it" id="spIt"></div></div>
    <div class="row">
      <button class="btn y" id="spGo">🎲 Nuova parola</button>
      <button class="btn" id="spReveal">👀 Soluzione</button>
      <button class="btn g" id="spSay">🔊 Ascolta</button>
    </div>
  </div>
</section>

<section id="find">
  <div class="stage">
    <p class="hint">Ascolta e tocca il carattere giusto!</p>
    <div class="row">
      <button class="btn g" id="fdPlay">🔊 Ascolta</button>
      <button class="btn y" id="fdNext">➡️ Avanti</button>
    </div>
    <div class="it" id="fdClue" style="font-size:26px;min-height:36px"></div>
    <div class="opts" id="fdOpts"></div>
    <div class="score" id="fdScore">⭐ 0</div>
  </div>
</section>

<section id="shout">
  <div class="stage">
    <p class="hint">Se la maestra GRIDA, voi sussurrate. Se la maestra sussurra, voi GRIDATE!</p>
    <div class="mode" id="shMode"></div>
    <div class="show" style="border-color:var(--purple)"><div class="big zh" id="shoutWord">🤫</div><div class="py" id="shPy"></div></div>
    <div class="row">
      <button class="btn y" id="shGo">📢 Vai!</button>
      <button class="btn g" id="shStar">⭐ Bravi!</button>
    </div>
    <div class="stars" id="shStars"></div>
  </div>
</section>

<script>
const W=[
 {zh:"他",py:"tā",it:"lui",em:"👦"},
 {zh:"是",py:"shì",it:"essere",em:"🟰"},
 {zh:"谁",py:"shéi",it:"chi?",em:"❓"},
 {zh:"哪",py:"nǎ",it:"quale?",em:"🤔"},
 {zh:"国",py:"guó",it:"paese",em:"🗺️"},
 {zh:"人",py:"rén",it:"persona",em:"🧍"},
 {zh:"中国人",py:"Zhōngguó rén",it:"cinese (persona)",em:"🇨🇳"},
 {zh:"中国",py:"Zhōngguó",it:"Cina",em:"🏯"},
 {zh:"他是谁？",py:"Tā shì shéi?",it:"Chi è lui?",em:"🕵️"},
 {zh:"他是中国人。",py:"Tā shì Zhōngguó rén.",it:"Lui è cinese.",em:"👦🇨🇳"},
 {zh:"哪国人？",py:"Nǎ guó rén?",it:"Di che paese?",em:"🌍"}
];
const BASE=W.slice(0,7);
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="zh-CN";u.rate=.8;speechSynthesis.speak(u);}catch(e){}}
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);

// tabs
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll("section").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");document.getElementById(b.dataset.s).classList.add("on");
});

// wall
const g=document.getElementById("wallGrid");
W.forEach(w=>{
  const t=document.createElement("div");t.className="tile"+(w.zh.length>3?" small":"");
  t.innerHTML=`<div class="in"><div class="face"><div class="big zh">${w.zh}</div></div><div class="face back"><div class="em">${w.em}</div><div class="py">${w.py}</div><div class="it">${w.it}</div></div></div>`;
  t.onclick=()=>{t.classList.toggle("flip");if(t.classList.contains("flip"))say(w.zh)};
  g.appendChild(t);
});

// spin
let cur=null,last=null;
document.getElementById("spGo").onclick=()=>{
  do{cur=rnd(W)}while(cur===last&&W.length>1);last=cur;
  const el=document.getElementById("spWord");el.textContent=cur.zh;el.style.fontSize=cur.zh.length>3?"70px":"130px";
  spPy.textContent="";spIt.textContent="";
};
document.getElementById("spReveal").onclick=()=>{if(cur){spPy.textContent=cur.py;spIt.textContent=cur.em+" "+cur.it}};
document.getElementById("spSay").onclick=()=>{if(cur)say(cur.zh)};

// find
let target=null,score=0,answered=false;
function newFind(){
  answered=false;target=rnd(BASE);fdClue.textContent="";
  const others=shuffle(BASE.filter(w=>w!==target)).slice(0,3);
  const box=document.getElementById("fdOpts");box.innerHTML="";
  shuffle([target,...others]).forEach(w=>{
    const b=document.createElement("button");b.className="opt";b.textContent=w.zh;
    if(w.zh.length>2)b.style.fontSize="40px";
    b.onclick=()=>{
      if(answered)return;
      if(w===target){answered=true;b.classList.add("ok");score++;fdScore.textContent="⭐ "+score;fdClue.textContent="🎉 "+target.py+" = "+target.it;}
      else{b.classList.add("no");}
    };
    box.appendChild(b);
  });
  setTimeout(()=>say(target.zh),300);
}
fdPlay.onclick=()=>target?say(target.zh):newFind();
fdNext.onclick=newFind;
newFind();

// shout & whisper
let stars=0;
shGo.onclick=()=>{
  const w=rnd(BASE),loud=Math.random()<.5;
  const el=document.getElementById("shoutWord");
  el.textContent=w.zh;el.style.fontSize=loud?(w.zh.length>2?"90px":"150px"):(w.zh.length>2?"34px":"50px");
  el.style.color=loud?"var(--red)":"var(--blue)";
  shPy.textContent=w.py;
  shMode.className="mode "+(loud?"loud":"soft");
  shMode.textContent=loud?"📢 La maestra GRIDA → voi 🤫 sussurrate":"🤫 La maestra sussurra → voi 📢 GRIDATE";
};
shStar.onclick=()=>{stars++;shStars.textContent="⭐".repeat(Math.min(stars,15))};
</script>
</body>
</html>
