<style>
/* Layout: lavagna 16:9 scalata come le altre lezioni Maja Jiejie; a sinistra il 田字格 dove il pennello scrive un tratto alla volta, a destra parola, tratto e comandi */
[hidden]{display:none!important}
:root{
  --crema:#FBF3E4; --carta:#FFFDF7; --rosso:#C8102E; --rosso-chiaro:#F6D5CF;
  --oro:#E9B949; --oro-chiaro:#FBEBC0; --verde:#3F8A2A; --verde-chiaro:#CDE8BC; --azzurro:#2F7FB8; --azzurro-chiaro:#D6E8F5;
  --viola:#7A4FB0; --ink:#2B1B17; --grigio:#6A5A55; --fondo:#E8D9C4; --guida:#E3CFC0; --ombra:#EADFD3;
  --f-body:'Fredoka','Trebuchet MS',Arial,sans-serif;
  --f-han:'Noto Sans SC','PingFang SC','Microsoft YaHei','Heiti SC',sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--fondo);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
:focus-visible{outline:4px solid var(--azzurro);outline-offset:3px}

.viewport{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:calc(64px + env(safe-area-inset-bottom,0px))}
.stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;transform:translate(-50%,-50%) scale(.5);background:var(--crema);border-radius:18px;overflow:hidden;box-shadow:0 10px 40px rgba(90,40,20,.25)}
.cornice{position:absolute;inset:18px;border:4px solid var(--rosso);border-radius:10px;pointer-events:none;box-shadow:inset 0 0 0 8px var(--crema),inset 0 0 0 11px var(--oro)}
.lanterna{position:absolute;top:0;width:110px;height:184px;pointer-events:none}
.slide{position:absolute;inset:0;display:none}
.slide.on{display:block;animation:entra .45s ease both}
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.nav{position:fixed;left:0;right:0;bottom:0;height:64px;padding:0 16px env(safe-area-inset-bottom,0px);display:flex;align-items:center;justify-content:center;gap:14px;background:var(--fondo)}
.nav button{border:3px solid var(--ink);background:var(--carta);border-radius:999px;height:44px;min-width:44px;padding:0 16px;font-weight:600;font-size:17px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
.nav button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.nav .conta{font-weight:600;font-size:17px;min-width:90px;text-align:center;font-variant-numeric:tabular-nums}
.nav .titolo-slide{font-size:15px;color:var(--grigio);max-width:30vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:560px){.nav .titolo-slide{display:none}}

.abs{position:absolute}
.han{font-family:var(--f-han);line-height:1.05;font-weight:500}
.btn{border:4px solid var(--ink);background:var(--carta);border-radius:999px;padding:12px 28px;font-size:30px;font-weight:600;cursor:pointer;box-shadow:0 6px 0 var(--ink);transition:transform .08s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn.oro{background:var(--oro)}
.btn.attivo{background:var(--verde-chiaro)}
.cornice-han{background:var(--carta);border:5px solid var(--rosso);border-radius:14px;box-shadow:inset 0 0 0 7px var(--carta),inset 0 0 0 10px var(--oro)}
.carta-c{border:4px solid var(--ink);border-radius:22px;background:var(--carta);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 6px 0 var(--ink);transition:transform .15s;padding:12px}
.slide.car .btn{padding:12px 14px;white-space:nowrap;font-size:28px}
.carta-c:hover{transform:translateY(-4px)}

/* parola con il carattere attuale evidenziato */
.parola{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.parola .pc{border:3px solid var(--ink);border-radius:14px;background:var(--carta);font-size:46px;width:72px;height:72px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;box-shadow:0 4px 0 var(--ink)}
.parola .pc.qui{color:var(--carta)}
.parola .pc:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

/* 田字格 */
.griglia{display:block;background:var(--carta);border-radius:10px}
.griglia .linea{fill:none;stroke-linecap:round;stroke-linejoin:round}
.griglia .num{font-family:var(--f-body);font-weight:700;font-size:60px}
.traccia{touch-action:none;cursor:crosshair}

/* tratti mostrati a destra */
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:56px;height:56px;border-radius:14px;border:3px solid var(--ink);background:var(--carta);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;box-sizing:border-box}
.chip.fatto{background:var(--oro)}
.chip.ora{background:var(--rosso);color:var(--carta);transform:scale(1.1)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

// crea una slide per ogni carattere
const CARS=[];
PAROLE.forEach((p,pi)=>p.car.forEach((c,ci)=>{ c.parola=p; c.pi=pi; c.ci=ci; c.col=p.col; CARS.push(c) }));
CARS.forEach((c,k)=>{ const s=document.createElement('section'); s.className='slide car'; s.dataset.car=k; s.dataset.titolo=`${c.han} ${c.py} · ${c.parola.han}`; stage.appendChild(s); c.slide=k+1 });
const slides=[...stage.querySelectorAll('.slide')];
let cur=0;

function fit(){ const vp=document.getElementById('viewport').getBoundingClientRect();
  stage.style.transform=`translate(-50%,-50%) scale(${Math.min(vp.width/1600,vp.height/900)*0.97})`; }
addEventListener('resize',fit); fit();

const uscita={}; let pronto=false;
function vai(i){
  i=Math.max(0,Math.min(slides.length-1,i));
  if(pronto&&i===cur) return;
  if(uscita[cur]) uscita[cur]();
  slides[cur].classList.remove('on'); cur=i; const s=slides[cur]; s.classList.add('on');
  document.getElementById('conta').textContent=`${cur+1} / ${slides.length}`;
  document.getElementById('titolo-slide').textContent=s.dataset.titolo||'';
  try{history.replaceState(null,'','#s'+(cur+1))}catch(e){}
  if(pronto&&cur===0) loopIntro();
}
document.getElementById('prec').onclick=()=>vai(cur-1);
document.getElementById('succ').onclick=()=>vai(cur+1);
document.getElementById('schermo').onclick=()=>{try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){}};
addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key==='PageDown') vai(cur+1); if(e.key==='ArrowLeft'||e.key==='PageUp') vai(cur-1); });
let sx=null;
stage.addEventListener('touchstart',e=>{ if(e.target.closest('button,.traccia')){sx=null;return} sx=e.touches[0].clientX },{passive:true});
stage.addEventListener('touchend',e=>{ if(sx===null) return; const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>60) vai(cur+(dx<0?1:-1)); sx=null });

function dici(t){ try{ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t); u.lang='zh-CN'; u.rate=.72;
  const v=speechSynthesis.getVoices().find(v=>/^zh/i.test(v.lang)); if(v) u.voice=v; speechSynthesis.speak(u); }catch(e){} }

const NS='http://www.w3.org/2000/svg';
const GUIDA=`<rect x="10" y="10" width="1004" height="1004" rx="20" fill="none" stroke="#C8102E" stroke-width="12"/>
  <path d="M512 10 V1014 M10 512 H1014" stroke="#E3CFC0" stroke-width="7" stroke-dasharray="25 25"/>
  <path d="M10 10 L1014 1014 M1014 10 L10 1014" stroke="#EADFD3" stroke-width="6" stroke-dasharray="25 25"/>`;
const PENNELLO=150;
let uid=0;
const mediana=m=>'M'+m.map(([x,y])=>x+' '+y).join(' L');
// griglia: ombra del carattere + tratti che si disegnano (ognuno ritagliato sulla sua forma)
function griglia(c){
  const id='g'+(uid++);
  const svg=document.createElementNS(NS,'svg'); svg.setAttribute('viewBox','0 0 1024 1024'); svg.setAttribute('class','griglia');
  svg.innerHTML=GUIDA
    +`<defs>${c.s.map((d,k)=>`<clipPath id="${id}c${k}"><path d="${d}"/></clipPath>`).join('')}</defs>`
    +`<g transform="translate(0,900) scale(1,-1)"><g class="ombra">${c.s.map(d=>`<path d="${d}" fill="#EADFD3"/>`).join('')}</g>`
    +`<g class="pennello">${c.m.map((m,k)=>`<g clip-path="url(#${id}c${k})"><path class="linea" d="${mediana(m)}" stroke="${c.col}" stroke-width="${PENNELLO}"/></g>`).join('')}</g></g>`
    +`<g class="numeri"></g><g class="miei"></g>`;
  const paths=[...svg.querySelectorAll('.pennello .linea')];
  return {svg,paths};
}

// ---- animazione di un singolo tratto
function lung(p){ try{return p.getTotalLength()}catch(e){return 500} }
function nascondi(p){ if(p._anim){p._anim.cancel(); p._anim=null} const L=lung(p)+PENNELLO; p.style.strokeDasharray=L+' '+L; p.style.strokeDashoffset=L; p.style.visibility='hidden'; }
function mostra(p){ p.style.strokeDasharray='none'; p.style.strokeDashoffset=0; p.style.visibility='visible'; }
function anima(p,velocita=1){
  return new Promise(ok=>{
    const L=lung(p)+PENNELLO; if(riduci){mostra(p); return setTimeout(ok,150)}
    p.style.strokeDasharray=L+' '+L; p.style.strokeDashoffset=L; p.style.visibility='visible';
    const dur=Math.max(450,L*1.6)/velocita;
    const a=p.animate([{strokeDashoffset:L},{strokeDashoffset:0}],{duration:dur,easing:'ease-in-out',fill:'forwards'});
    a.onfinish=()=>{mostra(p); a.cancel(); p._anim=null; ok()}; a.oncancel=()=>ok(); p._anim=a;
  });
}
const attesa=ms=>new Promise(r=>setTimeout(r,ms));

// ---- 1 intro: ogni carta scrive la sua parola da sola, in loop
const giri=[];
(function(){
  const box=document.getElementById('intro-carte');
  PAROLE.forEach(p=>{
    const b=document.createElement('button'); b.className='carta-c'; b.setAttribute('aria-label',`Vai a ${p.han}, ${p.it}`);
    const riga=document.createElement('div'); riga.style.cssText='display:flex;gap:12px';
    const gr=[];
    p.car.forEach(c=>{ const area=document.createElement('div'); area.style.cssText='width:170px;height:170px';
      const g=griglia(c); g.svg.style.width='100%'; g.svg.style.height='100%'; area.appendChild(g.svg); riga.appendChild(area); gr.push(g) });
    b.appendChild(riga);
    b.insertAdjacentHTML('beforeend',`<span style="font-size:38px;font-weight:600;color:${p.col}">${p.py} <span style="font-size:34px">${p.emo}</span></span><span style="font-size:28px">${p.it} <span style="font-size:22px;font-weight:600;color:var(--grigio)">· ${p.car.reduce((n,c)=>n+c.s.length,0)} tratti</span></span>`);
    b.onclick=()=>vai(p.car[0].slide); box.appendChild(b);
    giri.push(gr);
  });
})();
let introVivo=0;
async function loopIntro(){
  const io=++introVivo;
  while(io===introVivo){
    giri.forEach(gr=>gr.forEach(g=>g.paths.forEach(nascondi)));
    await Promise.all(giri.map(async gr=>{ for(const g of gr) for(const p of g.paths){ if(io!==introVivo) return; await anima(p,2.2); await attesa(80) } }));
    if(io!==introVivo) return;
    await attesa(1800);
  }
}

// ---- slide dei caratteri
stage.querySelectorAll('.slide.car').forEach(s=>{
  const c=CARS[+s.dataset.car], p=c.parola, n=c.s.length;
  s.innerHTML=`<div class="cornice"></div>
    <svg class="lanterna" style="left:1450px"><use href="#lanterna"/></svg>
    <div class="abs cornice-han" style="left:70px;top:70px;width:760px;height:760px;box-sizing:border-box;padding:28px"><div class="area" style="width:100%;height:100%;position:relative"></div></div>
    <div class="abs" style="left:880px;top:62px;width:560px;display:flex;flex-direction:column;gap:18px">
      <div style="display:flex;align-items:center;gap:26px">
        <span class="han" style="font-size:136px;color:${c.col}">${c.han}</span>
        <span style="display:flex;flex-direction:column;gap:8px"><span style="font-size:58px;font-weight:600">${c.py}</span>
        <button class="btn" data-dici="${c.han}" style="font-size:24px;padding:6px 18px;align-self:flex-start">🔊 Ascolta</button></span>
      </div>
      <div class="parola">
        ${p.car.map((x,i)=>`<button class="pc han" data-vai="${x.slide}" aria-label="${x.han}" style="${i===c.ci?`background:${c.col}`:''}" ${i===c.ci?'aria-current="true"':''}>${x.han}</button>`).join('')}
        <span style="display:flex;flex-direction:column;margin-left:6px"><span style="font-size:32px;font-weight:600;color:${c.col}">${p.py} ${p.emo}</span><span style="font-size:28px">${p.it}</span></span>
        ${p.car.length>1?`<button class="btn" data-dici="${p.han}" style="font-size:22px;padding:4px 14px;margin-left:auto">🔊 ${p.han}</button>`:''}
      </div>
      <div class="info cornice-han" style="padding:20px 28px;min-height:140px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;gap:8px">
        <span class="info-n" style="font-size:28px;font-weight:600;color:var(--grigio)">Premete ▶ e guardate il pennello!</span>
        <span class="info-t" style="font-size:40px;font-weight:700"></span>
      </div>
      <div class="chips" style="display:flex;flex-wrap:wrap;gap:10px"></div>
      <button class="btn b-cancella" hidden style="align-self:center">🧽 Cancella il mio disegno</button>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:4px">
        <button class="btn oro b-tutto">▶ Guarda tutto</button>
        <button class="btn oro b-uno">👆 Un tratto</button>
        <button class="btn b-ricomincia">↺ Ricomincia</button>
        <button class="btn b-prova">✏️ Prova tu</button>
      </div>
    </div>`;
  const area=s.querySelector('.area'), gr=griglia(c); area.appendChild(gr.svg);
  gr.svg.style.width='100%'; gr.svg.style.height='100%';
  const chips=s.querySelector('.chips'), infoN=s.querySelector('.info-n'), infoT=s.querySelector('.info-t');
  const numG=gr.svg.querySelector('.numeri'), mieiG=gr.svg.querySelector('.miei');
  c.t.forEach((t,k)=>{const x=document.createElement('span');x.className='chip';x.textContent=k+1;x.title=T[t].it;chips.appendChild(x)});
  if(n>8) chips.querySelectorAll('.chip').forEach(x=>{x.style.minWidth='48px';x.style.height='48px';x.style.fontSize='22px'});
  let fatti=0, corsa=0, occupato=false;

  // posizioni dei numeri: vicino all'inizio del tratto, senza sovrapporsi
  const R=n>10?32:40, POS=[];
  c.m.forEach(m=>{
    const a=m[0], b=m[Math.min(1,m.length-1)];
    const ax=a[0], ay=900-a[1], bx=b[0], by=900-b[1];
    let dx=ax-bx, dy=ay-by; const l=Math.hypot(dx,dy)||1; dx/=l; dy/=l;
    const prove=[[dx*(R+22),dy*(R+22)],[dx*(R*2+30),dy*(R*2+30)],[-dy*(R+30),dx*(R+30)],[dy*(R+30),-dx*(R+30)],[dx*(R*3+30),dy*(R*3+30)]]
      .map(([ox,oy])=>[Math.min(1014-R,Math.max(10+R,ax+ox)),Math.min(1014-R,Math.max(10+R,ay+oy))]);
    POS.push(prove.find(([x,y])=>POS.every(([u,v])=>Math.hypot(x-u,y-v)>R*2+6))||prove[0]);
  });
  function numero(k){
    const [x,y]=POS[k];
    const g=document.createElementNS(NS,'g');
    g.innerHTML=`<circle cx="${x}" cy="${y}" r="${R}" fill="#E9B949" stroke="#2B1B17" stroke-width="7"/><text class="num" x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" fill="#2B1B17" style="font-size:${R*1.45}px">${k+1}</text>`;
    numG.appendChild(g);
  }
  function stato(k){
    [...chips.children].forEach((x,i)=>{x.classList.toggle('fatto',i<fatti); x.classList.toggle('ora',i===k)});
    if(k==null){ infoN.textContent=fatti===n?`Finito! ${n} tratti`:'Premete ▶ e guardate il pennello!'; infoT.innerHTML=fatti===n?`<span class="han" style="color:${c.col}">${c.han}</span> ${c.py} ✅`:''; return }
    const t=T[c.t[k]];
    infoN.textContent=`Tratto ${k+1} di ${n}`;
    infoT.innerHTML=`<span class="han" style="color:${c.col}">${t.han}</span> ${t.py} · <span style="font-weight:500;font-size:30px">${t.it}</span>`;
  }
  function azzera(){ corsa++; occupato=false; fatti=0; gr.paths.forEach(nascondi); numG.innerHTML=''; stato(null) }
  async function uno(){
    if(occupato||fatti>=n) return false;
    occupato=true; const k=fatti, io=corsa; stato(k); numero(k);
    await anima(gr.paths[k]); if(io!==corsa) return false;
    fatti++; occupato=false;
    if(fatti===n){ stato(null); dici(c.han) } return true;
  }
  s.querySelector('.b-tutto').onclick=async()=>{ azzera(); const io=corsa; await attesa(250);
    while(io===corsa&&fatti<n){ await uno(); await attesa(300) } };
  s.querySelector('.b-uno').onclick=()=>{ if(fatti>=n) azzera(); uno() };
  s.querySelector('.b-ricomincia').onclick=azzera;
  s.querySelectorAll('[data-dici]').forEach(b=>b.onclick=()=>dici(b.dataset.dici));
  s.querySelectorAll('[data-vai]').forEach(b=>b.onclick=()=>vai(+b.dataset.vai));

  // prova tu: il bambino ripassa con il dito sull'ombra
  const bProva=s.querySelector('.b-prova'), bCanc=s.querySelector('.b-cancella');
  let prova=false, linea=null;
  bProva.onclick=()=>{ prova=!prova; bProva.classList.toggle('attivo',prova); bCanc.hidden=!prova; chips.hidden=prova; gr.svg.classList.toggle('traccia',prova);
    if(prova){ azzera(); infoN.textContent='Tocca a voi!'; infoT.innerHTML='<span style="font-size:32px">Ripassate l\'ombra con il dito, nell\'ordine dei numeri.</span>'; c.m.forEach((_,k)=>numero(k)) }
    else { mieiG.innerHTML=''; azzera() } };
  bCanc.onclick=()=>{ mieiG.innerHTML='' };
  function punto(e){ const q=gr.svg.createSVGPoint(); q.x=e.clientX; q.y=e.clientY; const m=gr.svg.getScreenCTM(); return m?q.matrixTransform(m.inverse()):q }
  gr.svg.addEventListener('pointerdown',e=>{ if(!prova) return; e.preventDefault(); try{gr.svg.setPointerCapture(e.pointerId)}catch(_){}
    const q=punto(e); linea=document.createElementNS(NS,'path'); linea.setAttribute('class','linea'); linea.setAttribute('stroke','#2B1B17'); linea.setAttribute('stroke-width',48);
    linea._d=`M${q.x.toFixed(0)} ${q.y.toFixed(0)}`; linea.setAttribute('d',linea._d+' l0 0'); mieiG.appendChild(linea) });
  gr.svg.addEventListener('pointermove',e=>{ if(!prova||!linea) return; const q=punto(e); linea._d+=` L${q.x.toFixed(0)} ${q.y.toFixed(0)}`; linea.setAttribute('d',linea._d) });
  const fine=()=>{ linea=null }; gr.svg.addEventListener('pointerup',fine); gr.svg.addEventListener('pointercancel',fine);

  uscita[c.slide]=()=>{ if(prova) bProva.onclick(); azzera() };
  azzera();
});

uscita[0]=()=>{ introVivo++ };
const m=/^#s(\d+)$/.exec(location.hash); vai(m?(+m[1]-1):0);
pronto=true; if(cur===0) loopIntro();
})();
