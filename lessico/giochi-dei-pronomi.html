<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Giochi dei pronomi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Nunito:wght@400..800&family=Noto+Sans+SC:wght@500;700&display=swap">
<style>
/* Layout: una "lavagnetta" kawaii — testata con stelline, fila di schede-gioco grosse, un unico tavolo di gioco al centro. Mondo pastello unico, chiaro per scelta. */
:root{
  --bg:#FFF6EC; --card:#FFFDFB; --ink:#3D2C3E; --soft:#6B5566; --line:#EBDCE1;
  --pink:#FF7FA8; --pink-l:#FFD9E5; --mint:#3FBF98; --mint-l:#CFF1E5; --yellow:#F5B416; --yellow-l:#FFEDB8;
  --ok:#2E9E7C; --no:#D9467A;
  --f-head:"Fredoka","Trebuchet MS",sans-serif; --f-body:"Nunito",Arial,sans-serif; --f-han:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;
  background-image:radial-gradient(circle at 8% 12%,var(--pink-l) 0 60px,transparent 61px),radial-gradient(circle at 94% 6%,var(--mint-l) 0 80px,transparent 81px),radial-gradient(circle at 90% 92%,var(--yellow-l) 0 70px,transparent 71px);
  background-attachment:fixed}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
h1{font-family:var(--f-head);font-weight:600;font-size:clamp(30px,5vw,46px);line-height:1.05;margin:0;text-wrap:balance}
h1 .han{font-family:var(--f-han);color:var(--pink)}
.sub{margin:4px 0 0;color:var(--soft);font-size:17px}
.stars{display:flex;align-items:center;gap:12px;background:var(--card);border:3px solid var(--ink);border-radius:999px;padding:8px 10px 8px 18px;box-shadow:0 5px 0 var(--ink)}
.stars b{font-family:var(--f-head);font-size:30px;font-variant-numeric:tabular-nums;min-width:2ch;text-align:center}
.stars svg{width:34px;height:34px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--mint);outline-offset:3px}
.small{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:700;color:var(--soft)}
nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.tab{background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 6px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.tab .t-han{font-family:var(--f-han);font-weight:700;font-size:30px;line-height:1}
.tab .t-name{font-family:var(--f-head);font-weight:600;font-size:18px;line-height:1.15;text-align:center}
.tab:hover{transform:translateY(-2px)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--card);box-shadow:0 2px 0 var(--ink);transform:translateY(4px)}
.table{background:var(--card);border:3px solid var(--ink);border-radius:32px;padding:clamp(16px,3vw,32px);box-shadow:0 10px 0 var(--pink-l);min-height:520px;display:flex;flex-direction:column;gap:18px}
.g-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.g-head h2{font-family:var(--f-head);font-weight:600;font-size:clamp(24px,3.4vw,34px);margin:0;line-height:1.1}
.g-head p{margin:2px 0 0;color:var(--soft);max-width:60ch}
.big{font-family:var(--f-head);font-weight:600;font-size:22px;border:3px solid var(--ink);border-radius:999px;padding:10px 26px;background:var(--yellow);box-shadow:0 5px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.big.alt{background:var(--card)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.han{font-family:var(--f-han);font-weight:700}
.py{font-family:var(--f-han);font-weight:700}
/* memory */
.mem{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.mc{display:block;width:100%;aspect-ratio:3/4;max-width:100%;perspective:800px;border:0;background:none;padding:0;cursor:pointer}
.mc .in{display:block;position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d;pointer-events:none}
.mc.up .in,.mc.done .in{transform:rotateY(180deg)}
.mc .fa{position:absolute;inset:0;border:3px solid var(--ink);border-radius:18px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column}
.mc .back{background:repeating-linear-gradient(45deg,var(--pink-l) 0 12px,#FFE9F0 12px 24px)}
.mc .back span{font-family:var(--f-head);font-weight:700;font-size:40px;color:var(--pink);background:var(--card);border:3px solid var(--ink);border-radius:50%;width:62px;height:62px;display:flex;align-items:center;justify-content:center}
.mc .front{transform:rotateY(180deg);background:var(--card);padding:6px}
.mc .front svg{width:92%;height:auto}
.mc .front .han{font-size:clamp(40px,7vw,76px);line-height:1}
.mc.done .front{background:var(--mint-l)}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{border:3px solid var(--ink);border-radius:24px;background:var(--card);padding:14px 8px;box-shadow:0 6px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .1s}
.tile .han{font-size:clamp(52px,9vw,96px);line-height:1.05}
.tile .py{font-size:22px;color:var(--soft);min-height:1.3em}
.tile.ok{background:var(--mint-l);animation:hop .5s}
.tile.no{animation:shake .4s}
@keyframes hop{30%{transform:translateY(-14px) scale(1.04)}60%{transform:translateY(0)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.msg{font-family:var(--f-head);font-weight:600;font-size:26px;min-height:1.4em;margin:0}
.msg.good{color:var(--ok)} .msg.bad{color:var(--no)}
.speaker{display:flex;align-items:center;gap:10px}
.speaker svg{width:28px;height:28px}
.hint{color:var(--soft);font-size:16px}
/* chi e */
.who{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:24px;align-items:center}
.who .pic{background:var(--yellow-l);border:3px solid var(--ink);border-radius:28px;aspect-ratio:1;max-width:100%;display:flex;align-items:center;justify-content:center;padding:12px}
.who .pic svg{width:100%;height:auto}
.opts{display:flex;flex-direction:column;gap:14px}
.opt{display:flex;align-items:center;gap:18px;border:3px solid var(--ink);border-radius:22px;background:var(--card);padding:10px 20px;box-shadow:0 5px 0 var(--ink);text-align:left}
.opt .han{font-size:56px;line-height:1.1}
.opt .py{font-size:22px;color:var(--soft)}
.opt.ok{background:var(--mint-l);animation:hop .5s} .opt.no{animation:shake .4s;background:#FBE3EA}
.progress{display:flex;gap:6px}
.progress i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);background:var(--card)}
.progress i.on{background:var(--yellow)}
/* ruota */
.wheel-box{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center}
.wheel{position:relative;width:100%;max-width:440px;aspect-ratio:1;margin:0 auto}
.wheel canvas{width:100%;height:100%;display:block}
.wheel .pin{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:20px solid transparent;border-right:20px solid transparent;border-top:38px solid var(--ink)}
.result{border:3px solid var(--ink);border-radius:28px;padding:24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:300px;justify-content:center;background:var(--pink-l)}
.result .han{font-size:clamp(90px,14vw,150px);line-height:1}
.result .py{font-size:34px}
.result .it{font-family:var(--f-head);font-size:24px;color:var(--soft)}
.result .gest{font-family:var(--f-head);font-weight:600;font-size:26px;background:var(--card);border:3px solid var(--ink);border-radius:999px;padding:6px 20px;margin-top:6px}
/* traccia */
.trace{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.pad{position:relative;width:100%;max-width:440px;aspect-ratio:1;margin:0 auto;border:3px solid var(--ink);border-radius:24px;overflow:hidden;background:#FFFFFF;touch-action:none}
.pad canvas{position:absolute;inset:0;width:100%;height:100%}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:3px solid var(--ink);border-radius:18px;background:var(--card);padding:6px 14px;display:flex;align-items:baseline;gap:8px;box-shadow:0 4px 0 var(--ink)}
.chip .han{font-size:34px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.count{font-family:var(--f-head);font-weight:600;font-size:22px}
/* confetti */
.cf{position:fixed;width:14px;height:14px;border-radius:4px;pointer-events:none;z-index:50}
@media (max-width:760px){
  nav{grid-template-columns:repeat(3,minmax(0,1fr))}
  .mem{grid-template-columns:repeat(4,minmax(0,1fr))}
  .who,.wheel-box,.trace{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:440px){
  nav{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mem{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  <header>
    <div>

    <div class="stars" aria-live="polite">

  </nav>

  <section class="table" id="stage" aria-live="polite"></section>
</div>

const $ = (s, r = document) => r.querySelector(s);
const stage = $("#stage");
let score = 0;
try { score = +localStorage.getItem("pron-score") || 0; } catch (e) {}
const scoreEl = $("#score"); scoreEl.textContent = score;
function addStar(n = 1) { score += n; scoreEl.textContent = score; try { localStorage.setItem("pron-score", score); } catch (e) {} }
$("#reset").onclick = () => { score = 0; scoreEl.textContent = 0; try { localStorage.setItem("pron-score", 0); } catch (e) {} };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

function confetti(x, y) {
  if (reduce) return;
  const cols = ["#FF7FA8", "#3FBF98", "#F5B416", "#9C7BFF", "#5B9BFF", "#FF9361"];
  for (let i = 0; i < 28; i++) {
    const c = document.createElement("i"); c.className = "cf";
    c.style.background = cols[i % cols.length]; c.style.left = x + "px"; c.style.top = y + "px";
    document.body.appendChild(c);
    const a = Math.random() * Math.PI * 2, v = 120 + Math.random() * 220;
    c.animate([{ transform: "translate(0,0) rotate(0)", opacity: 1 },
      { transform: `translate(${Math.cos(a) * v}px,${Math.sin(a) * v + 160}px) rotate(${Math.random() * 720}deg)`, opacity: 0 }],
      { duration: 900 + Math.random() * 500, easing: "cubic-bezier(.2,.7,.4,1)" }).onfinish = () => c.remove();
  }
}
function burst(el) { const r = el.getBoundingClientRect(); confetti(r.left + r.width / 2, r.top + r.height / 2); }

/* ---------- voce ---------- */
let zhVoice = null;
function pickVoice() { try { zhVoice = speechSynthesis.getVoices().find(v => /^zh(-|_)?(CN|Hans)?/i.test(v.lang)) || null; } catch (e) {} }
try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}
function say(text) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = "zh-CN"; u.rate = 0.75;
    if (zhVoice) u.voice = zhVoice;
    speechSynthesis.speak(u); return true;
  } catch (e) { return false; }
}
const SPK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';

const GAMES = {};

GAMES.memory = () => {
  const pairs = ["我", "你", "他", "她", "它", "他们"];
  const cards = shuffle(pairs.flatMap(k => [{ k, t: "han" }, { k, t: "pic" }]));
  stage.innerHTML = `<div class="g-head"><div><h2>Memory: carattere e disegno</h2><p>Gira due carte: trova il carattere che va con il suo disegno. Ogni coppia vale una stellina!</p></div>
    <div class="row"><span class="count" id="pairs">0 / 6 coppie</span><button class="big alt" id="again" type="button">Rimescola</button></div></div>
    <div class="mem">${cards.map((c, i) => `<button class="mc" type="button" data-i="${i}" aria-label="Carta ${i + 1}"><span class="in"><span class="fa back"><span>?</span></span>
    <span class="fa front">${c.t === "han" ? `<span class="han">${c.k}</span><span class="py" style="font-size:18px;color:var(--soft)">${c.k === "他们" ? "tāmen" : D.info[c.k].py}</span>` : D.ill[c.k]}</span></span></button>`).join("")}</div>
    <p class="msg good" id="m"></p>`;
  let open = [], lock = false, found = 0;
  $("#again").onclick = GAMES.memory;
  stage.querySelectorAll(".mc").forEach(b => b.onclick = () => {
    if (lock || b.classList.contains("up") || b.classList.contains("done")) return;
    b.classList.add("up"); open.push(b);
    if (open.length === 2) {
      lock = true;
      const [a, c] = open, ka = cards[a.dataset.i], kc = cards[c.dataset.i];
      if (ka.k === kc.k && ka.t !== kc.t) {
        setTimeout(() => { a.classList.add("done"); c.classList.add("done"); found++; addStar(); burst(c);
          $("#pairs").textContent = found + " / 6 coppie"; say(ka.k);
          if (found === 6) $("#m").textContent = "Bravissimi! 太棒了! tài bàng le!";
          open = []; lock = false; }, 450);
      } else setTimeout(() => { a.classList.remove("up"); c.classList.remove("up"); open = []; lock = false; }, 1100);
    }
  });
};

GAMES.ascolta = () => {
  let target = null, tries = 0;
  stage.innerHTML = `<div class="g-head"><div><h2>Ascolta e trova</h2><p>Premi «Ascolta»: la voce dice un pronome in cinese. Tocca il carattere giusto! (Se non senti la voce, Maja lo dice a voce alta.)</p></div>
    <div class="row"><button class="big speaker" id="play" type="button">${SPK} Ascolta</button><button class="big alt" id="help" type="button">Aiuto: pinyin</button></div></div>
    <div class="tiles">${D.ch.map(c => `<button class="tile" type="button" data-c="${c}"><span class="han">${c}</span><span class="py"></span></button>`).join("")}</div>
    <p class="msg" id="m">Premi «Ascolta» per cominciare!</p>`;
  const msg = $("#m");
  const pool = ["我", "你", "们", "它", "他"]; // 他/她 si leggono uguali: in ascolto accettiamo entrambi
  function next() {
    target = pool[Math.random() * pool.length | 0]; tries = 0;
    stage.querySelectorAll(".tile").forEach(t => { t.classList.remove("ok", "no"); t.querySelector(".py").textContent = ""; });
    msg.className = "msg"; msg.textContent = "Ascolta bene… quale carattere è?";
    say(target);
  }
  $("#play").onclick = () => { if (!target) next(); else say(target); };
  $("#help").onclick = () => stage.querySelectorAll(".tile").forEach(t => t.querySelector(".py").textContent = D.info[t.dataset.c].py);
  stage.querySelectorAll(".tile").forEach(t => t.onclick = () => {
    if (!target) { msg.textContent = "Prima premi «Ascolta»!"; return; }
    const c = t.dataset.c, ok = c === target || (target === "他" && (c === "她" || c === "它"));
    if (ok) {
      t.classList.add("ok"); burst(t); if (tries === 0) addStar();
      msg.className = "msg good";
      msg.textContent = target === "他" ? `Sì! tā può essere 他, 她 o 它: si leggono uguali!` : `Sì! ${target} ${D.info[target].py} = ${D.info[target].it}`;
      target = null; setTimeout(() => { msg.textContent += "  Premi «Ascolta» per la prossima!"; }, 900);
    } else { tries++; t.classList.remove("no"); void t.offsetWidth; t.classList.add("no"); msg.className = "msg bad"; msg.textContent = "Quasi! Ascolta ancora e riprova."; }
  });
};

GAMES.chi = () => {
  const items = [{ k: "我", a: "我" }, { k: "你", a: "你" }, { k: "他", a: "他" }, { k: "她", a: "她" }, { k: "它", a: "它" }, { k: "他们", a: "他们" }];
  const qs = shuffle(items); let n = 0, tries = 0;
  const PY = { "我": "wǒ", "你": "nǐ", "他": "tā", "她": "tā", "它": "tā", "他们": "tāmen", "我们": "wǒmen" };
  const IT = { "我": "io (indica se stesso)", "你": "tu (indica te!)", "他": "lui", "她": "lei", "它": "esso (animale)", "他们": "loro" };
  function q() {
    if (n >= qs.length) {
      stage.innerHTML = `<div class="result" style="background:var(--mint-l)"><span class="han">太棒了!</span><span class="py">tài bàng le!</span><span class="it">Fantastico! Hai indovinato tutti i personaggi.</span><button class="big" id="again" type="button">Gioca ancora</button></div>`;
      $("#again").onclick = GAMES.chi; burst($(".result")); return;
    }
    const it = qs[n]; tries = 0;
    const wrong = shuffle(Object.keys(PY).filter(k => k !== it.a)).slice(0, 2);
    const opts = shuffle([it.a, ...wrong]);
    stage.innerHTML = `<div class="g-head"><div><h2>Chi è?</h2><p>Guarda il disegno e scegli il pronome giusto.</p></div>
      <div class="progress" aria-label="Domanda ${n + 1} di ${qs.length}">${qs.map((_, i) => `<i class="${i < n ? "on" : ""}"></i>`).join("")}</div></div>
      <div class="who"><div class="pic">${D.ill[it.k]}</div>
      <div class="opts">${opts.map(o => `<button class="opt" type="button" data-o="${o}"><span class="han">${o}</span><span class="py">${PY[o]}</span></button>`).join("")}</div></div>
      <p class="msg" id="m"></p>`;
    stage.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      if (b.dataset.o === it.a) {
        b.classList.add("ok"); burst(b); if (tries === 0) addStar(); say(it.a);
        $("#m").className = "msg good"; $("#m").textContent = `Sì! ${it.a} ${PY[it.a]} = ${IT[it.k]}`;
        n++; setTimeout(q, 1600);
      } else { tries++; b.classList.add("no"); $("#m").className = "msg bad"; $("#m").textContent = "Guarda bene il disegno e riprova!"; }
    });
  }
  q();
};

  const EX = { "我们": { py: "wǒmen", it: "noi", gest: "Braccia larghe!", col: "#FF7FA8" }, "你们": { py: "nǐmen", it: "voi", gest: "Indica tutti!", col: "#3FBF98" }, "他们": { py: "tāmen", it: "loro", gest: "Indica lontano!", col: "#5B9BFF" } };
  const inf = k => D.info[k] || EX[k];
  const COLS = ["#FFD9E5", "#CFF1E5", "#D8E7FF", "#FFE0CF", "#E5DCFF", "#FFEDB8", "#FFC7D8", "#BFE9DA"];
  stage.innerHTML = `<div class="g-head"><div><h2>La ruota dei pronomi</h2><p>Gira la ruota: dove si ferma? Leggi il pronome in cinese e fai il gesto!</p></div>
    <button class="big" id="spin" type="button">Gira la ruota!</button></div>
    <div class="wheel-box"><div class="wheel"><canvas id="wc" width="880" height="880" aria-label="Ruota con i pronomi"></canvas><span class="pin"></span></div>
    <div class="result" id="res"><span class="it">Premi «Gira la ruota!»</span><span class="han" style="color:var(--pink)">?</span></div></div>`;
  const cv = $("#wc"), x = cv.getContext("2d"), N = segs.length, R = 420;
  let rot = 0, spinning = false;
  function draw() {
    x.clearRect(0, 0, 880, 880); x.save(); x.translate(440, 440); x.rotate(rot);
    for (let i = 0; i < N; i++) {
      const a0 = -Math.PI / 2 + i * 2 * Math.PI / N - Math.PI / N, a1 = a0 + 2 * Math.PI / N;
      x.beginPath(); x.moveTo(0, 0); x.arc(0, 0, R, a0, a1); x.closePath();
      x.fillStyle = COLS[i]; x.fill(); x.lineWidth = 8; x.strokeStyle = "#3D2C3E"; x.stroke();
      x.save(); x.rotate((a0 + a1) / 2); x.translate(R * 0.64, 0); x.rotate(Math.PI / 2);
      x.fillStyle = "#3D2C3E"; x.textAlign = "center"; x.textBaseline = "middle";
      x.font = `700 ${segs[i].length > 1 ? 76 : 110}px "Noto Sans SC","PingFang SC",sans-serif`; x.fillText(segs[i], 0, 0); x.restore();
    }
    x.beginPath(); x.arc(0, 0, 60, 0, Math.PI * 2); x.fillStyle = "#FFFDFB"; x.fill(); x.lineWidth = 8; x.stroke();
    x.restore();
  }
  draw();
  $("#spin").onclick = () => {
    if (spinning) return; spinning = true;
    const pick = Math.random() * N | 0, start = rot;
    const target = Math.ceil(start / (2 * Math.PI)) * 2 * Math.PI + 4 * 2 * Math.PI - pick * 2 * Math.PI / N + (Math.random() - .5) * (Math.PI / N) * .7;
    const T = reduce ? 10 : 3600, t0 = performance.now();
    $("#res").innerHTML = `<span class="it">Gira, gira…</span><span class="han" style="color:var(--pink)">?</span>`;
    (function f(t) {
      const p = Math.min(1, (t - t0) / T), e = 1 - Math.pow(1 - p, 4);
      rot = start + (target - start) * e; draw();
      if (p < 1) return requestAnimationFrame(f);
      spinning = false; const k = segs[pick], i = inf(k);
      $("#res").style.background = COLS[pick];
      $("#res").innerHTML = `<span class="han">${k}</span><span class="py">${i.py}</span><span class="it">${i.it}</span><span class="gest">${i.gest}</span>`;
      say(k); burst($("#res")); addStar();
    })(t0);
  };
};

GAMES.traccia = () => {
  let cur = "我", anim = null;
  stage.innerHTML = `<div class="g-head"><div><h2>Traccia il carattere</h2><p>Scegli un carattere, premi «Guarda» per vedere l'ordine dei tratti, poi scrivilo tu con il dito o con il mouse sopra il carattere grigio.</p></div></div>
    <div class="trace"><div class="pad"><canvas id="gc" width="880" height="880"></canvas><canvas id="dc" width="880" height="880" aria-label="Area per scrivere"></canvas></div>
    <div style="display:flex;flex-direction:column;gap:18px">
      <div class="chips">${D.ch.map(c => `<button class="chip" type="button" data-c="${c}" aria-pressed="${c === cur}"><span class="han">${c}</span><span class="py">${D.info[c].py}</span></button>`).join("")}</div>
      <p class="count" id="cnt"></p>
      <div class="row"><button class="big" id="watch" type="button">Guarda i tratti</button><button class="big alt" id="clear" type="button">Cancella</button><button class="big alt" id="done" type="button">Fatto!</button></div>
      <p class="hint">Conta i tratti in cinese mentre scrivi: 一 yī, 二 èr, 三 sān, 四 sì, 五 wǔ, 六 liù, 七 qī.</p>
    </div></div>`;
  const gc = $("#gc"), g = gc.getContext("2d"), dc = $("#dc"), d = dc.getContext("2d");
  const S = 860 / 1024;
  const T = () => g.setTransform(S, 0, 0, -S, 10, 10 + 900 * S);
  function gridDraw() {
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, 880, 880);
    g.strokeStyle = D.info[cur].light; g.lineWidth = 4; g.setLineDash([18, 16]);
    g.beginPath(); g.moveTo(440, 0); g.lineTo(440, 880); g.moveTo(0, 440); g.lineTo(880, 440); g.moveTo(0, 0); g.lineTo(880, 880); g.moveTo(880, 0); g.lineTo(0, 880); g.stroke(); g.setLineDash([]);
  }
  function paths() { return D.strokes[cur].strokes.map(s => new Path2D(s)); }
  function base(k) { // k = tratti completati
    gridDraw(); T(); const ps = paths();
    ps.forEach((p, i) => { g.fillStyle = i < k ? "#3D2C3E" : "#EFE6EA"; g.fill(p); });
    $("#cnt").textContent = `${cur} ${D.info[cur].py} · ${ps.length} tratti`;
  }
  function len(m) { let L = 0; for (let i = 1; i < m.length; i++) L += Math.hypot(m[i][0] - m[i - 1][0], m[i][1] - m[i - 1][1]); return L; }
  function partial(m, l) { g.beginPath(); g.moveTo(m[0][0], m[0][1]); let acc = 0;
    for (let i = 1; i < m.length; i++) { const sl = Math.hypot(m[i][0] - m[i - 1][0], m[i][1] - m[i - 1][1]);
      if (acc + sl >= l) { const r = (l - acc) / sl; g.lineTo(m[i - 1][0] + (m[i][0] - m[i - 1][0]) * r, m[i - 1][1] + (m[i][1] - m[i - 1][1]) * r); break; }
      g.lineTo(m[i][0], m[i][1]); acc += sl; } g.stroke(); }
  function watch() {
    if (anim) cancelAnimationFrame(anim);
    const ps = paths(), ms = D.strokes[cur].medians, col = D.info[cur].col; let i = 0, t0 = null;
    function f(t) {
      if (t0 === null) t0 = t; const L = len(ms[i]), dur = reduce ? 1 : Math.max(450, L * 0.9), p = Math.min(1, (t - t0) / dur);
      base(i); g.save(); g.clip(ps[i]); g.strokeStyle = col; g.lineWidth = 160; g.lineCap = "round"; g.lineJoin = "round"; partial(ms[i], L * p); g.restore();
      $("#cnt").textContent = `Tratto ${i + 1} di ${ps.length}`;
      if (p >= 1) { i++; t0 = null; if (i >= ps.length) { base(ps.length); $("#cnt").textContent = `${cur} ${D.info[cur].py} · ${ps.length} tratti. Ora tocca a te!`; setTimeout(() => base(0), 1400); anim = null; return; }
        anim = setTimeout(() => { anim = requestAnimationFrame(f); }, 260); return; }
      anim = requestAnimationFrame(f);
    }
    anim = requestAnimationFrame(f);
  }
  base(0);
  stage.querySelectorAll(".chip").forEach(b => b.onclick = () => { cur = b.dataset.c; stage.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === b)); d.clearRect(0, 0, 880, 880); base(0); say(cur); });
  $("#watch").onclick = watch;
  $("#clear").onclick = () => d.clearRect(0, 0, 880, 880);
  $("#done").onclick = e => { addStar(); burst(e.currentTarget); say(cur); };
  let drawing = false, last = null;
  const pos = e => { const r = dc.getBoundingClientRect(); return [(e.clientX - r.left) * 880 / r.width, (e.clientY - r.top) * 880 / r.height]; };
  dc.addEventListener("pointerdown", e => { drawing = true; last = pos(e); dc.setPointerCapture(e.pointerId); });
  dc.addEventListener("pointermove", e => { if (!drawing) return; const p = pos(e);
    d.strokeStyle = D.info[cur].col; d.lineWidth = 34; d.lineCap = "round"; d.lineJoin = "round";
    d.beginPath(); d.moveTo(last[0], last[1]); d.lineTo(p[0], p[1]); d.stroke(); last = p; });
  ["pointerup", "pointercancel", "pointerleave"].forEach(ev => dc.addEventListener(ev, () => drawing = false));
};

function show(name) {
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.g === name));
  try { speechSynthesis.cancel(); } catch (e) {}
  GAMES[name]();
  try { localStorage.setItem("pron-tab", name); } catch (e) {}
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => show(t.dataset.g));
let start = location.hash.slice(1);
if (!GAMES[start]) { try { start = localStorage.getItem("pron-tab"); } catch (e) {} }
show(GAMES[start] ? start : "memory");
</script>

</body></html>
