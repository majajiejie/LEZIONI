name: foto-libro
on:
  push:
    branches: [foto-libro-tmp]
    paths: [tools/queries.txt]
permissions:
  contents: write
jobs:
  scarica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/foto.py
      - run: |
          git config user.name "Maja.Jiejie"
          git config user.email "majajiejie@users.noreply.github.com"
          git add foto
          git commit -m "Foto per il libro" || echo nothing
          git push
