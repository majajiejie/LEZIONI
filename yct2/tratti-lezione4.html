function svg(paths,k){return `<svg viewBox="0 0 1024 1024"><g transform="translate(0,900) scale(1,-1)">${paths.map((d,i)=>`<path d="${d}" fill="${i<k?'#2B1B17':i===k?'#C8102E':'#EADFD3'}"/>`).join('')}</g></svg>`}
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
document.getElementById('lista').innerHTML=PAROLE.map((p,pi)=>`
<div class="card" style="--c:${p[4]}">
 <div class="top"><div class="emo">${p[3]}</div>
  <div class="parola"><div class="py">${p[1]}</div><div class="w">${p[0]}</div><div class="it">${p[2]}</div></div>
  <div class="btns"><button onclick="say('${p[0]}')">🔊</button><button onclick="apri(${pi})">▶ Guarda</button><button onclick="apri(${pi},1)">✏️ Prova tu</button></div></div>
 ${[...p[0]].map(c=>{const S=STROKES[c];return `<div class="char"><div class="lab"><b>${c}</b> · ${S.length} tratti</div>
  <div class="steps">${S.map((_,k)=>`<div class="step">${svg(S,k)}${k+1}</div>`).join('')}</div>
  <div class="prova">${'<div>'+c+'</div>'}${'<div>'+c+'</div>'}${('<div class="vuoto">'+c+'</div>').repeat(4)}</div></div>`}).join('')}
</div>`).join('');
let cur=0,ws=[];
function costruisci(){const box=document.getElementById('writers');box.innerHTML='';ws=[];
 if(typeof HanziWriter==='undefined'){box.textContent='Serve la connessione a internet per l\'animazione.';return}
 const size=Math.min(220,Math.floor((innerWidth-80)/[...PAROLE[cur][0]].length));
 [...PAROLE[cur][0]].forEach(c=>{const d=document.createElement('div');d.className='tzg';box.appendChild(d);
  ws.push(HanziWriter.create(d,c,{width:size,height:size,padding:12,showOutline:true,strokeColor:'#2B1B17',outlineColor:'#EADFD3',highlightColor:'#C8102E',drawingColor:'#C8102E',strokeAnimationSpeed:.7,delayBetweenStrokes:450}))})}
async function anima(){costruisci();for(const w of ws){await w.animateCharacter()}}
function quiz(){costruisci();ws.forEach(w=>{w.hideCharacter();w.quiz()})}
function apri(i,q){cur=i;document.getElementById('mpy').textContent=PAROLE[i][1]+'  '+PAROLE[i][0];document.getElementById('mit').textContent=PAROLE[i][2];
 document.getElementById('modal').classList.add('on');say(PAROLE[i][0]);q?quiz():anima()}
function chiudi(){document.getElementById('modal').classList.remove('on');document.getElementById('writers').innerHTML=''}
</script></body></html>
